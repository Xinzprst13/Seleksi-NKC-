<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seleksi NKC Baru</title>

<style>
  /* Desain super simpel */
  body {
    background-color: #2b1b4d; /* Warna ungu gelap */
    color: #ffffff;
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0;
  }

  .kotak {
    background-color: #3d296b; /* Ungu lebih terang */
    padding: 20px;
    border-radius: 10px;
    max-width: 500px;
    margin: 0 auto; /* Biar ke tengah */
    border: 2px solid #9b7bff;
  }

  h1 {
    text-align: center;
    color: #ffb3ff;
  }

  label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
    font-weight: bold;
  }

  input[type="text"], input[type="url"], select {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #9b7bff;
    background-color: #1a0f2e;
    color: white;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background-color: #9b7bff;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background-color: #7a5cd6;
  }

  /* Kotak sembunyi */
  .sembunyi {
    display: none;
  }

  /* Link Grup */
  .link-grup {
    display: block;
    text-align: center;
    background-color: #ffb3ff;
    color: #2b1b4d;
    padding: 12px;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
    margin-top: 15px;
  }
</style>
</head>
<body>

  <div class="kotak" id="kotakForm">
    <h1>Seleksi Marga NKC</h1>
    
    <label>Username TikTok</label>
    <input type="text" id="username" placeholder="@username">

    <label>Pilih Generasi</label>
    <select id="generasi">
      <option value="">-- Pilih --</option>
      <option value="Gen 1">Gen 1</option>
      <option value="Gen 2">Gen 2</option>
    </select>

    <div id="formGen1" class="sembunyi">
      <label>Link Bukti Video TikTok (Khusus Gen 1)</label>
      <input type="url" id="linkTiktok" placeholder="Tempel link TikTok di sini">
      
      <p style="font-size: 12px; color: #ffb3ff;">
        Wajib pakai hashtag: #nakanocreator dan #margankc
      </p>

      <input type="checkbox" id="ceklisHashtag"> 
      <span style="font-size: 13px;">Saya sudah pakai hashtag tersebut</span>
    </div>

    <div style="margin-top: 15px;">
      <input type="checkbox" id="ceklisAturan"> 
      <span style="font-size: 13px;">Saya setuju dengan aturan NKC</span>
    </div>

    <button id="tombolLanjut">LANJUT</button>
    <p id="pesanError" style="color: #ff8080; font-weight: bold; text-align: center;"></p>
  </div>

  <div class="kotak sembunyi" id="kotakSukses">
    <h1>Berhasil!</h1>
    <p style="text-align: center;">Silakan masuk ke grup di bawah ini:</p>
    
    <div id="grupGen1" class="sembunyi">
      <a href="https://chat.whatsapp.com/E2qwdPXxEYFKqzsc3vWTOB" class="link-grup" target="_blank">BUKA GRUP GEN 1</a>
    </div>

    <div id="grupGen2" class="sembunyi">
      <a href="https://chat.whatsapp.com/DoNiRGUInBhBjbHvNgU3uF?s=cl&p=a&iam=2" class="link-grup" target="_blank">BUKA GRUP GEN 2</a>
    </div>
  </div>

<script>
  // Ambil elemen
  var username = document.getElementById("username");
  var generasi = document.getElementById("generasi");
  var formGen1 = document.getElementById("formGen1");
  var linkTiktok = document.getElementById("linkTiktok");
  var ceklisHashtag = document.getElementById("ceklisHashtag");
  var ceklisAturan = document.getElementById("ceklisAturan");
  var tombolLanjut = document.getElementById("tombolLanjut");
  var pesanError = document.getElementById("pesanError");

  // Kalau ganti generasi, munculin form Gen 1
  generasi.onchange = function() {
    if (generasi.value === "Gen 1") {
      formGen1.style.display = "block";
    } else {
      formGen1.style.display = "none";
    }
  };

  // Kalau tombol lanjut diklik
  tombolLanjut.onclick = function() {
    pesanError.innerHTML = ""; // Hapus pesan error lama
    
    var nama = username.value.trim();
    var gen = generasi.value;
    var link = linkTiktok.value.trim();

    // Cek username
    if (nama === "") {
      pesanError.innerHTML = "Isi username dulu!";
      return;
    }

    // Cek generasi
    if (gen === "") {
      pesanError.innerHTML = "Pilih generasi dulu!";
      return;
    }

    // Cek khusus Gen 1
    if (gen === "Gen 1") {
      if (link === "" || link.indexOf("tiktok.com") === -1) {
        pesanError.innerHTML = "Link TikTok tidak valid!";
        return;
      }
      if (ceklisHashtag.checked === false) {
        pesanError.innerHTML = "Centang bukti hashtag dulu!";
        return;
      }
    }

    // Cek aturan
    if (ceklisAturan.checked === false) {
      pesanError.innerHTML = "Kamu harus setuju aturan!";
      return;
    }

    // JIKA LOLOS SEMUA: Sembunyikan form, tampilkan sukses
    document.getElementById("kotakForm").style.display = "none";
    document.getElementById("kotakSukses").style.display = "block";

    // Tampilkan link grup yang sesuai
    if (gen === "Gen 1") {
      document.getElementById("grupGen1").style.display = "block";
    } else {
      document.getElementById("grupGen2").style.display = "block";
    }
  };
</script>

</body>
</html>
